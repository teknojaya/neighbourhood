name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Placeholder untuk Prisma generate; bukan database production.
      DATABASE_URL: postgresql://ci:ci_only@127.0.0.1:5432/neighbourhood_ci
      VITE_USE_FIREBASE_EMULATORS: "false"

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: "24.22.0"
          cache: npm

      - run: npm ci

      - run: npm run check
