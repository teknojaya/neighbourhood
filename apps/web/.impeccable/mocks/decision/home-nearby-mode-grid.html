<!doctype html>
<html lang="en">
<head>

<style>

nt-size:14px;color:#78716c;margin:11px 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.item{overflow:hidden;background:#fff;border:1px solid #e7e5e4;border-radius:12px}.picture{height:111px;display:grid;place-items:center;background:#efefeb}.picture svg{height:92px;width:130px}.picture.plant{background:#e8eee6}.picture.drill{background:#ecece9}.picture.books{background:#f2ece2}.picture.lamp{background:#eee9e6}.details{padding:10px 11px 11px}.details h2{font-size:16px;line-height:1.25;font-weight:650;margin:0 0 7px;letter-spacing:-.15px}.meta{display:flex;align-items:center;justify-content:space-between;font-size:14px;color:#78716c;gap:6px}.mode{font-weight:650;color:#0f766e}.borrow{color:#57534e}.nav{position:absolute;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e7e5e4;height:81px;display:flex;padding:10px 8px 18px}.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;font-size:12px;color:#78716c;padding:2px 0}.nav svg{width:22px;height:22px;stroke-width:1.7}.nav button[aria-current=page]{color:#0f766e;font-weight:700}.nav button[aria-current=page] svg{fill:#ccfbf1}.nav .ask-tab svg{border:1px solid #d6d3d1;border-radius:6px;padding:2px}

</head>
<body>
<main class="phone">
<header class="top">
<div><div class="brand">NeighbourHood</div><div class="location"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 1 1 14 0Z"/><circle cx="12" cy="10" r="2.5"/></svg>Ari · within 2 km</div></div>
<button class="area" aria-label="Change area and radius"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3" fill="white"/><circle cx="15" cy="17" r="3" fill="white"/></svg></button>
</header>
<button class="ask">
<span class="ask-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M20 11a8 8 0 0 1-8 8H5l-3 3V11a9 9 0 0 1 18 0Z"/><path d="M9 8a3 3 0 0 1 6 0c0 2-3 2-3 4M12 15v.5"/></svg></span>
<span><strong>Ask for help finding something</strong><small>Tell us what you need nearby</small></span>
<svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m9 6 6 6-6 6"/></svg>
</button>
<section class="feed" aria-label="Items nearby">
<div class="feed-head"><h1>Nearby items</h1><button class="share"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>Share</button></div>
<div class="modes" aria-label="Item type"><button aria-pressed="true">All</button><button aria-pressed="false">Free</button><button aria-pressed="false">Borrow</button></div>
<p class="demo">Layout sketch · example items</p>
<div class="grid">
<article class="item"><div class="picture plant"><svg viewBox="0 0 130 100" aria-label="Illustration of a houseplant" role="img"><path d="M65 67V25" stroke="#6b7d58" stroke-width="4"/><path d="M65 51C38 51 33 28 39 17c24 0 30 17 26 34M65 40C85 40 96 21 87 11 66 16 60 27 65 40" fill="#8a9a70"/><path d="M48 62h36l-6 28H54Z" fill="#bc8769"/><path d="M45 61h42v8H45Z" fill="#cb987c"/></svg></div><div class="details"><h2>Monstera cutting</h2><div class="meta"><span class="mode">Free</span><span>350 m</span></div></div></article>
<article class="item"><div class="picture drill"><svg viewBox="0 0 130 100" aria-label="Illustration of a drill" role="img"><path d="M28 24h47l13 9v22H28Z" fill="#708b85"/><path d="M88 32h17v13H88Z" fill="#706e67"/><path d="M105 37h17v3h-17Z" fill="#a8a49b"/><path d="m48 54 25 1-7 28H49Z" fill="#595e58"/><path d="M43 82h32v9H43Z" fill="#708b85"/><path d="M34 31v15M40 31v15" stroke="#a8bbb4" stroke-width="3"/></svg></div><div class="details"><h2>Cordless drill</h2><div class="meta"><span class="mode borrow">Borrow</span><span>600 m</span></div></div></article>
<article class="item"><div class="picture books"><svg viewBox="0 0 130 100" aria-label="Illustration of a stack of books" role="img"><path d="M24 69h79v15H24Z" fill="#8e9d89"/><path d="M30 71h69v10H30Z" fill="#faf8ef"/><path d="M29 49h70v18H29Z" fill="#be8872"/><path d="M35 52h60v11H35Z" fill="#faf8ef"/><path d="m36 25 66 7-2 17-66-7Z" fill="#b4aa86"/><path d="m40 29 57 6-1 10-57-6Z" fill="#faf8ef"/></svg></div><div class="details"><h2>Weekend reads</h2><div class="meta"><span class="mode">Free</span><span>800 m</span></div></div></article>
<article class="item"><div class="picture lamp"><svg viewBox="0 0 130 100" aria-label="Illustration of a desk lamp" role="img"><path d="M64 83V56l22-28" fill="none" stroke="#827d73" stroke-width="5"/><path d="m74 20 17 8 8 25-36-17Z" fill="#b1a592"/><path d="m63 36 36 17" stroke="#8e826f" stroke-width="3"/><ellipse cx="64" cy="85" rx="25" ry="7" fill="#a69882"/><circle cx="64" cy="57" r="5" fill="#b1a592"/></svg></div><div class="details"><h2>Desk lamp</h2><div class="meta"><span class="mode borrow">Borrow</span><span>1.1 km</span></div></div></article>
</div>
</section>
<nav class="nav" aria-label="Main navigation">
<button aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m3 10 9-7 9 7v11h-6v-7H9v7H3Z"/></svg>Home</button>
<button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="9"/><path d="m16 8-2 6-6 2 2-6Z"/></svg>Explore</button>

<button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg>Activity</button>
<button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Profile</button>
</nav>
</main>

</html>
